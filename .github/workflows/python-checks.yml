name: Python checks

on:
  push:
    branches:
      - master
      - "upgrade/**"
  pull_request:
    branches:
      - master
      - "upgrade/**"

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Smoke-test runtime imports
        run: >-
          python -c "import requests, cv2, numpy, keras, tensorflow,
          sklearn, bs4, yaml; print('runtime imports OK')"
