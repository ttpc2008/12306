name: Python checks

on:
  push:
    branches:
      - master
      - "upgrade/**"
  pull_request:
    branches:
      - master
      - "upgrade/**"

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
